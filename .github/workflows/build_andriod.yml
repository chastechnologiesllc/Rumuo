name: Build Android

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build APK (PR compile check only)
        if: github.event_name == 'pull_request'
        run: |
          flutter build apk --debug --target lib/main.dart \
            --dart-define=RUMUO_API_BASE_URL=https://rumuo-api-ch-as-technologies-llc.vercel.app/api/resources

      - name: Decode keystore
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/rumuo.jks
          cat > android/key.properties <<EOF
          storeFile=rumuo.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Build production APK
        if: github.event_name != 'pull_request'
        run: |
          flutter build apk --release --target lib/main.dart \
            --build-number=${{ github.run_number }} \
            --dart-define=RUMUO_API_BASE_URL=https://rumuo-api-ch-as-technologies-llc.vercel.app/api/resources

      - name: Build production AAB
        if: github.event_name != 'pull_request'
        run: |
          flutter build appbundle --release --target lib/main.dart \
            --build-number=${{ github.run_number }} \
            --dart-define=RUMUO_API_BASE_URL=https://rumuo-api-ch-as-technologies-llc.vercel.app/api/resources

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: rumuo-production-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Upload AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: rumuo-production-aab
          path: frontend/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            frontend/build/app/outputs/flutter-apk/app-release.apk
            frontend/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
