name: Build Web

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure web platform
        run: |
          if [ ! -d web ]; then
            flutter create . --platforms=web --project-name rumuo
          fi
          rm -f test/widget_test.dart

      - name: Analyse
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build web (release)
        run: |
          flutter build web --release --target lib/main.dart \
            --base-href "/Rumuo/" \
            --build-number=${{ github.run_number }} \
            --dart-define=RUMUO_API_BASE_URL=https://rumuo-api-ch-as-technologies-llc.vercel.app/api/resources

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: rumuo-web
          path: frontend/build/web
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build/web
          force_orphan: true
          enable_jekyll: false
