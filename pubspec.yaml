name: rumuo
description: Rumuo - Financial Literacy Video Hub by chAs Tech Group
publish_to: none
version: 1.0.0+7

environment:
  sdk: ">=3.3.0 <4.0.0"
  # workmanager 0.10.x requires Flutter >= 3.38.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  xml: ^6.5.0
  connectivity_plus: ^6.0.5
  google_mobile_ads: ^5.3.0
  # 3.2.3 moves to in_app_purchase_storekit 0.4.x, whose win-back-offer
  # Swift APIs require a newer Xcode SDK than the current macOS-14 CI host.
  # Rumuo uses the stable purchase APIs available in 3.2.2.
  in_app_purchase: 3.2.2
  # Billing library 8.0.0 is required by Google Play from Aug 31, 2026.
  # Constraint loosened to allow the version that targets billing 8 natively;
  # the build.gradle resolutionStrategy forces billing 8 as a belt-and-suspenders
  # guard while the plugin publishes its own update.
  # in_app_purchase_storekit removed — in_app_purchase is a federated plugin
  # that brings in its own iOS implementation automatically. Listing the
  # platform impl separately can cause version constraint conflicts.
  flutter_local_notifications: ^18.0.1
  # 0.5.2 used removed Flutter v1 embedding APIs (shim / PluginRegistrantCallback).
  # 0.9.1 retains the initialize/periodic-task APIs used by Rumuo while
  # remaining compatible with the pre-iOS-26 federated implementations.
  workmanager: 0.9.1
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  url_launcher: ^6.3.1
  provider: ^6.1.2
  shimmer: ^3.0.0
  timeago: ^3.6.1
  share_plus: ^10.0.2
  flutter_animate: ^4.5.0
  package_info_plus: ^8.1.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.18.0
  in_app_review: ^2.0.9
  web: ^1.1.0
  # ── Content & Performance Overhaul ───────────────────────────────────────────
  # YouTube in-app playback — iFrame Player API, no API key, Android + iOS
  youtube_player_flutter: ^9.1.3
  # Web playback uses the maintained official IFrame API implementation.
  youtube_player_iframe: ^6.0.2
  # Inline feed auto-play: fires when card is >50% visible
  visibility_detector: ^0.4.0+2
  # Blog / article inline web renderer with navigation interception
  flutter_inappwebview: ^6.1.5
  # EPUB in-app reader (Epub.js engine); Android, iOS, macOS and Web
  flutter_epub_viewer: ^2.0.0
  # Controlled HTML/TXT rendering for readable book content without publisher CSS
  flutter_html: ^3.0.0
  # Reading progress persistence (CFI for EPUB)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Cross-platform PDF reader with Web/native rendering and text selection
  # 2.5 requires Flutter 3.47; 2.4.8 supports Flutter >=3.41 and this CI’s 3.44.
  pdfrx: ^2.4.8
  # App-internal file storage — used by PdfDownloadService to cache downloaded
  # PDFs. No extra Android/iOS permissions needed for the app documents dir.
  path_provider: ^2.1.4

# workmanager_apple 0.9.6+ adds BGContinuedProcessingTask references that require
# the iOS 26 SDK. Rumuo only uses periodic tasks, so keep the iOS implementation
# on the 0.9.3 line for compatibility with the current Xcode CI host. Pin the
# platform interface too because newer interfaces add named parameters not present
# in these pre-iOS-26 implementations.
# html pinned below 0.15.7: that release (shipped days before this was added)
# changed something in its private, undocumented src/query_selector.dart —
# not covered by semver since it's under src/ — which flutter_html 3.0.0
# relies on internally (see its own "don't use the internal code of the html
# package as it may change unexpectedly" comment). Caused:
#   Error: Method not found: 'matches'.
#     return qs.matches(element, selector);
# in flutter_html-3.0.0/lib/src/tree/styled_element.dart during
# compileFlutterBuildRelease. No newer flutter_html exists yet (3.0.0 is
# still latest as of this fix) to properly resolve this, so pinning the
# transitive dependency is the correct fix until it does.
dependency_overrides:
  workmanager_android: 0.9.1
  workmanager_apple: 0.9.3
  workmanager_platform_interface: 0.9.2
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

