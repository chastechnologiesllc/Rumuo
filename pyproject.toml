[project]
name = "rumuo-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "pyyaml==6.0.2",
    "httpx==0.27.2",
    "aiohttp==3.10.5",
    "beautifulsoup4==4.12.3",
    "trafilatura==1.12.1",
    "mangum==0.17.0",
]

[tool.vercel]
entrypoint = "api.index:app"
