name: Rumuo Platform CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'rumuo-platform/**'
  pull_request:
    branches: [main]
    paths:
      - 'rumuo-platform/**'

jobs:
  test:
    name: Pipeline DoD Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rumuo-platform

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rumuo_test
          POSTGRES_PASSWORD: rumuo_test
          POSTGRES_DB: rumuo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://rumuo_test:rumuo_test@localhost:5432/rumuo_test
      DB_ECHO: "false"
      ACQUISITION_ACTIVE: "0"    # never enable acquisition in CI

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rumuo-platform/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply schema to test DB
        run: |
          pip install psycopg2-binary --break-system-packages 2>/dev/null || true
          PGPASSWORD=rumuo_test psql \
            -h localhost -U rumuo_test -d rumuo_test \
            -f db/migrations/001_initial_schema.sql

      - name: Run ED-01 DoD tests
        run: pytest tests/pipeline_e2e/test_ed01_dod.py -v --tb=short

      - name: Run ED-04 DoD tests
        run: pytest tests/pipeline_e2e/test_ed04_dod.py -v --tb=short

      - name: Run LD-02 DoD tests
        run: pytest tests/pipeline_e2e/test_ld02_dod.py -v --tb=short

      - name: Enum consistency check
        run: |
          python3 - << 'PYEOF'
          from core.enums import TrustState, PipelineStatus, AccessStatus, Relation
          from services.trust.state_machine import ALLOWED_TRANSITIONS
          # Verify every state in ALLOWED_TRANSITIONS is a valid TrustState
          valid = {e.value for e in TrustState}
          for from_state, targets in ALLOWED_TRANSITIONS.items():
              assert from_state in valid, f"Unknown from_state in state machine: {from_state}"
              for to_state in targets:
                  assert to_state in valid, f"Unknown to_state in state machine: {to_state}"
          print("Enum consistency: OK")
          PYEOF

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rumuo-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rumuo-platform/requirements.txt
      - run: pip install ruff
      - run: ruff check . --select E,F,W --ignore E501
